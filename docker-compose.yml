
services:
  backend:
    build: .
    container_name: CodeSandbox
    volumes:
      - ./src:/home/CodeSandbox/src
    ports:
      - "8001:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  db:
    image: postgres:18
    container_name: postgres_db
    restart: unless-stopped
    ports:
      - "5431:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - codesandbox_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"'
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4
    container_name: redis_cache
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD}
      - --maxmemory-policy
      - noeviction
    volumes:
      - codesandbox_redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG'
      interval: 10s
      timeout: 5s
      retries: 5
  
  celery_worker:
    build: .
    container_name: codesandbox_celery_worker
    restart: unless-stopped

    command: >
      celery -A config worker
      --loglevel=INFO
      --concurrency=2
      --queues=analysis,execution,maintenance
      --hostname=worker@%h

    env_file:
      - .env

    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev

    volumes:
      - ./src:/home/CodeSandbox/src

    working_dir: /home/CodeSandbox/src

    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    container_name: codesandbox_mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"

volumes:
  codesandbox_postgres_data:
    name: codesandbox_postgres_data
  codesandbox_redis_data:
    name: codesandbox_redis_data
